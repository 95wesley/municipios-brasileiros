<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Municípios Brasileiros · Mapa</title>
    <meta name="description" content="Explore os 5.570 municípios brasileiros em um mapa, com busca, filtro por UF e geolocalização.">

    <!-- Leaflet (2D map). Version pinned. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="toolbar">
            <div class="panel-header">
                <h1>Municípios Brasileiros</h1>
                <button type="button" id="toggle-panel" class="toggle" aria-expanded="true"
                        aria-controls="panel-body" aria-label="Minimizar painel" title="Minimizar"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            </div>

            <div id="panel-body" class="panel-body">
                <form id="search-form" class="search" autocomplete="off">
                    <div class="search-field">
                        <input id="search-input" type="text" spellcheck="false"
                               placeholder="Buscar município…" aria-label="Buscar município"
                               role="combobox" aria-expanded="false" aria-controls="search-list"
                               aria-autocomplete="list">
                        <ul id="search-list" class="search-list hidden" role="listbox"
                            aria-label="Sugestões de município"></ul>
                    </div>
                    <button type="submit">Buscar</button>
                </form>

                <div class="controls">
                    <div class="uf-field" id="uf-field">
                        <div class="field-head">
                            <span id="uf-label">Estados (UF)</span>
                            <button type="button" id="uf-clear" class="hidden">Limpar</button>
                        </div>
                        <div class="uf-box" id="uf-box">
                            <span id="uf-chips" class="uf-chips"></span>
                            <input id="uf-input" type="text" autocomplete="off" spellcheck="false"
                                   placeholder="Todas · digite uma UF"
                                   role="combobox" aria-expanded="false" aria-controls="uf-list"
                                   aria-labelledby="uf-label">
                        </div>
                        <ul id="uf-list" class="uf-list hidden" role="listbox" aria-multiselectable="true"
                            aria-labelledby="uf-label"></ul>
                    </div>

                    <div class="field-filter">
                        <div class="field-head">
                            <label for="field-select">Filtrar por</label>
                        </div>
                        <div class="field-row">
                            <select id="field-select" aria-label="Campo do filtro">
                                <option value="nome">Cidade</option>
                                <option value="codigo_ibge">Código IBGE</option>
                                <option value="ddd">DDD</option>
                                <option value="fuso_horario">Fuso horário</option>
                            </select>
                            <input id="field-input" type="text" autocomplete="off" spellcheck="false"
                                   placeholder="Digite o valor…" aria-label="Valor do filtro">
                        </div>
                    </div>

                    <button type="button" id="locate-btn" class="primary">Minha localização</button>
                </div>

                <p id="status" class="status" role="status" aria-live="polite">Carregando dados…</p>
            </div>
        </header>

        <section id="map" class="view" aria-label="Mapa"></section>

        <aside id="info" class="info hidden" aria-live="polite">
            <button type="button" id="info-close" class="close" aria-label="Fechar">×</button>
            <h2 id="info-name"></h2>
            <dl id="info-details"></dl>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
