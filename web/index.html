<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Municípios Brasileiros · Mapa</title>
    <meta name="description" content="Explore os 5.570 municípios brasileiros em um mapa, com busca e geolocalização.">

    <!-- Leaflet (2D map). Version pinned. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="toolbar">
            <div class="panel-header">
                <h1>Municípios Brasileiros</h1>
                <button type="button" id="toggle-panel" class="toggle" aria-expanded="true"
                        aria-controls="panel-body" aria-label="Minimizar painel" title="Minimizar">–</button>
            </div>

            <div id="panel-body" class="panel-body">

            <form id="search-form" class="search" autocomplete="off">
                <input id="search-input" type="search" list="municipios-list"
                       placeholder="Buscar município…" aria-label="Buscar município">
                <datalist id="municipios-list"></datalist>
                <button type="submit">Buscar</button>
            </form>

            <div class="controls">
                <label>
                    UF
                    <select id="uf-filter" aria-label="Filtrar por UF">
                        <option value="">Todas</option>
                    </select>
                </label>


                <button type="button" id="locate-btn" class="primary">Minha localização</button>
            </div>

            <p id="status" class="status" role="status" aria-live="polite">Carregando dados…</p>
            </div>
        </header>

        <section id="map" class="view" aria-label="Mapa"></section>

        <aside id="info" class="info hidden" aria-live="polite">
            <button type="button" id="info-close" class="close" aria-label="Fechar">×</button>
            <h2 id="info-name"></h2>
            <dl id="info-details"></dl>
        </aside>

    </main>

    <script src="app.js"></script>
</body>
</html>
