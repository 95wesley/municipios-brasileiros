name: Validate data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stdlib only: no dependencies to install.
      - name: Validate dataset and derived files
        run: python scripts/validate_files.py
